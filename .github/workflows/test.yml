name: static tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Discover Lightly-maintained plugins and build the matrix.
  # ---------------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Build plugin matrix
        id: set-matrix
        run: |
          uv run --no-project --python 3.12 scripts/get_lightly_plugins.py > matrix.json 2>&1 || true
          echo "--- matrix.json ---"
          cat matrix.json
          echo "--- plugins.toml exists? ---"
          ls -la plugins.toml
          echo "--- script debug ---"
          uv run --no-project --python 3.12 -c "
          import sys; from pathlib import Path
          print('cwd:', Path.cwd())
          script = Path('scripts/get_lightly_plugins.py').resolve()
          print('script:', script)
          root = script.parent.parent
          print('root:', root)
          print('plugins.toml:', root / 'plugins.toml', (root / 'plugins.toml').exists())
          "
          echo "--- retry with explicit path ---"
          uv run --no-project --python 3.12 scripts/get_lightly_plugins.py
          matrix=$(uv run --no-project --python 3.12 scripts/get_lightly_plugins.py)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Run mypy per-plugin, on both the minimum compatible and latest Python.
  # ---------------------------------------------------------------------------
  mypy:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.matrix) }}
        python-version:
          - min       # resolved per-plugin below
          - "3.13"
    name: "mypy · ${{ matrix.plugin.plugin }} · py${{ matrix.python-version == 'min' && matrix.plugin.min_python || matrix.python-version }}"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install plugin dependencies
        run: |
          uv venv --python ${{ matrix.python-version == 'min' && matrix.plugin.min_python || matrix.python-version }}
          uv pip install mypy
          uv pip install -e "./${{ matrix.plugin.path }}" || echo "::warning::pip install failed — running mypy without plugin deps"

      - name: Run mypy
        run: |
          uv run mypy --config-file mypy.ini ${{ matrix.plugin.path }}/src/
