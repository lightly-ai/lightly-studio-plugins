[project]
name = "lightly_plugins_sam3_segmentation"
version = "0.1.0"
description = "SAM3 instance segmentation plugin for Lightly Studio"
requires-python = ">=3.9"
dependencies = [
    "lightly_studio>=0.4.12",
    "torch",
    "transformers>=4.50.0",
    "Pillow",
    "numpy",
    "huggingface_hub>=0.20",
    "sqlmodel",
    "labelformat",
]

[project.entry-points."lightly_studio.plugins"]
sam3_segmentation = "lightly_plugins_sam3_segmentation.operator:SAM3SegmentationOperator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightly_plugins_sam3_segmentation"]
