[project]
name = "lightly_plugins_yolo_object_detection"
version = "0.1.0"
description = "YOLO inference operator for object detection auto-labeling"
requires-python = ">=3.9"
dependencies = [
    "lightly_studio>=1.0.4",
    "sqlmodel",
    "ultralytics",
]

[project.entry-points."lightly_studio.plugins"]
yolo_object_detection = "lightly_plugins_yolo_object_detection.operator:YoloObjectDetectionOperator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightly_plugins_yolo_object_detection"]
