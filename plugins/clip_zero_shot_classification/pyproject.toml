[project]
name = "lightly_plugins_clip_zero_shot_classification"
version = "0.1.0"
description = "Zero-shot image classification operator for Lightly Studio"
requires-python = ">=3.9"
dependencies = [
    "lightly_studio>=1.0.4",
    "numpy",
    "sqlmodel",
]

[project.entry-points."lightly_studio.plugins"]
clip_zero_shot_classification = "lightly_plugins_clip_zero_shot_classification.operator:ClipZeroShotClassificationOperator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightly_plugins_clip_zero_shot_classification"]
