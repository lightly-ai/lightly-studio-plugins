[project]
name = "lightly_plugins_kitti_export_object_detection"
version = "0.1.0"
description = "KITTI object detection export plugin for Lightly Studio"
requires-python = ">=3.9"
dependencies = [
    "lightly_studio>=1.0.0",
    "labelformat",
    "sqlmodel",
]

[project.entry-points."lightly_studio.plugins"]
kitti_export_object_detection = "lightly_plugins_kitti_export_object_detection.operator:ExportKittiOperator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightly_plugins_kitti_export_object_detection"]
