[project]
name = "lightly_plugins_zero_shot_classification"
version = "0.1.0"
description = "Zero-shot classification operator for Lightly Studio"
requires-python = ">=3.9"
dependencies = [
    # TableParameter is not in 1.0.4.
    "lightly_studio>=1.0.5",
    "numpy",
    "sqlmodel",
]

[project.entry-points."lightly_studio.plugins"]
zero_shot_classification = "lightly_plugins_zero_shot_classification.operator:ZeroShotClassificationOperator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightly_plugins_zero_shot_classification"]
