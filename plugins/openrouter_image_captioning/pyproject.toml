[project]
name = "lightly_plugins_openrouter_image_captioning"
version = "0.1.0"
description = "OpenRouter image captioning plugin for Lightly Studio"
requires-python = ">=3.9"
dependencies = [
    "lightly_studio>=1.0.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "sqlmodel",
]

[project.entry-points."lightly_studio.plugins"]
openrouter_image_captioning = "lightly_plugins_openrouter_image_captioning.operator:OpenRouterImageCaptioningOperator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightly_plugins_openrouter_image_captioning"]
