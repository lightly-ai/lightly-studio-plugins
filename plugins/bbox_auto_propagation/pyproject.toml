[project]
name = "lightly-plugins-bbox_auto_propagation"
version = "0.1.0"
description = "BBox auto propagation"
requires-python = ">=3.8"

[project.entry-points."lightly_studio.plugins"]
bbox_auto_propagation = "lightly_plugins_bbox_auto_propagation.operator:AutoPropagateOperator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightly_plugins_bbox_auto_propagation"]